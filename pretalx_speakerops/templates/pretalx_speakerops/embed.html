<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.name }} schedule</title>
  <style>
    :root{--ink:#17202a;--muted:#68737d;--line:#dfe4e8;--surface:#fff;--accent:#175cd3;--soft:#f5f7fa;color-scheme:light}
    *{box-sizing:border-box}body{font:1rem/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft);margin:0;padding:clamp(.75rem,3vw,2rem)}main{max-width:76rem;margin:auto}header{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1.5rem}h1{margin:0;font-size:clamp(1.65rem,4vw,2.6rem)}header a{color:var(--accent)}.schedule{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}article{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.1rem;box-shadow:0 8px 24px rgba(23,32,42,.05)}article h2{font-size:1.1rem;margin:.35rem 0}.meta{color:var(--muted);font-size:.9rem}.room{display:inline-block;color:var(--accent);background:#eaf2ff;border-radius:999px;padding:.2rem .6rem}@media(max-width:36rem){header{display:block}header a{display:inline-block;margin-top:.5rem}}
  </style>
</head>
<body>
<main aria-labelledby="schedule-title">
  <header><div><small>Published program</small><h1 id="schedule-title">{{ event.name }}</h1></div><a href="{% url 'plugins:speakerops:speakerops_gallery' event.slug %}">Meet the speakers</a></header>
  <div class="schedule">
  {% for slot in slots %}
    <article>
      <div class="meta"><time datetime="{{ slot.start|date:'c' }}">{{ slot.start }}</time></div>
      <h2>{{ slot.submission.title }}</h2>
      <p>{{ slot.submission.display_speaker_names }}</p>
      <span class="room">{{ slot.room.name }}</span>
    </article>
  {% empty %}<p>No published sessions yet.</p>{% endfor %}
  </div>
</main>
</body>
</html>
