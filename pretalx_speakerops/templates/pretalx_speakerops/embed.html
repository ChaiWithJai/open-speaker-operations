<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.name }} schedule</title>
  <link rel="stylesheet" href="{% static 'pretalx_speakerops/carbon/carbon-styles.css' %}">
  <style>
    body{font:1rem/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--cds-text-primary,#17202a);background:var(--cds-background,#f5f7fa);margin:0;padding:clamp(.75rem,3vw,2rem)}main{max-width:76rem;margin:auto}header{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1.5rem}h1{margin:0;font-size:clamp(1.65rem,4vw,2.6rem);font-weight:600}header a{color:var(--cds-interactive,#175cd3)}.schedule{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}article{background:var(--cds-layer-01,#fff);border:1px solid var(--cds-border-subtle,#dfe4e8);border-radius:4px;padding:1.1rem}article h2{font-size:1.1rem;margin:.35rem 0;font-weight:600}.meta{color:var(--cds-text-secondary,#68737d);font-size:.9rem}.room{display:inline-block;color:var(--cds-interactive,#175cd3);background:var(--cds-background-brand,#eaf2ff);border-radius:999px;padding:.2rem .6rem;font-size:.75rem;font-weight:600}@media(max-width:36rem){header{display:block}header a{display:inline-block;margin-top:.5rem}}
  </style>
</head>
<body>
<main aria-labelledby="schedule-title">
  <header><div><small style="color:var(--cds-text-secondary,#68737d);">Published program</small><h1 id="schedule-title">{{ event.name }}</h1></div><a href="{% url 'plugins:speakerops:speakerops_gallery' event.slug %}">Meet the speakers</a></header>
  <div class="schedule">
  {% for slot in slots %}
    <article>
      <div class="meta"><time datetime="{{ slot.start|date:'c' }}">{{ slot.start }}</time></div>
      <h2>{{ slot.submission.title }}</h2>
      <p style="margin:.25rem 0;color:var(--cds-text-secondary,#68737d);">{{ slot.submission.display_speaker_names }}</p>
      <span class="room">{{ slot.room.name }}</span>
    </article>
  {% empty %}<p>No published sessions yet.</p>{% endfor %}
  </div>
</main>
</body>
</html>
