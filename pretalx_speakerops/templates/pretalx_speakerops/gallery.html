<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.name }} speakers</title>
  <link rel="stylesheet" href="{% static 'pretalx_speakerops/carbon/carbon-styles.css' %}">
  <style>
    body{font:1rem/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--cds-text-primary,#17202a);background:var(--cds-background,#f5f7fa);margin:0;padding:clamp(.75rem,3vw,2rem)}main{max-width:76rem;margin:auto}header{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1.5rem}h1{margin:0;font-size:clamp(1.65rem,4vw,2.6rem);font-weight:600}a{color:var(--cds-interactive,#175cd3)}.gallery{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}article{background:var(--cds-layer-01,#fff);border:1px solid var(--cds-border-subtle,#dfe4e8);border-radius:4px;padding:1.25rem;min-height:10rem}article h2{margin:.5rem 0;font-size:1.2rem;font-weight:600}.avatar{width:3.25rem;height:3.25rem;border-radius:50%;display:grid;place-items:center;background:var(--cds-background-brand,#eaf2ff);color:var(--cds-interactive,#175cd3);font-weight:800;font-size:1.35rem}.muted{color:var(--cds-text-secondary,#68737d)}@media(max-width:36rem){header{display:block}}
  </style>
</head>
<body><main aria-labelledby="gallery-title">
  <header><div><small style="color:var(--cds-text-secondary,#68737d);">Published program</small><h1 id="gallery-title">Meet the speakers</h1></div><a href="{% url 'plugins:speakerops:speakerops_embed' event.slug %}">View schedule</a></header>
  <div class="gallery">
  {% for speaker in speakers %}<article tabindex="0"><div class="avatar" aria-hidden="true">{{ speaker.name|first|upper }}</div><h2>{{ speaker.get_display_name }}</h2><p class="muted">Speaker at {{ event.name }}</p></article>
  {% empty %}<p>No published speakers yet.</p>{% endfor %}
  </div>
</main></body></html>
