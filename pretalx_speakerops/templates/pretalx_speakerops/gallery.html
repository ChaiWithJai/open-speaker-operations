<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.name }} speakers</title>
  <style>
    :root{--ink:#17202a;--muted:#68737d;--line:#dfe4e8;--surface:#fff;--accent:#175cd3;--soft:#f5f7fa;color-scheme:light}*{box-sizing:border-box}body{font:1rem/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft);margin:0;padding:clamp(.75rem,3vw,2rem)}main{max-width:76rem;margin:auto}header{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1.5rem}h1{margin:0;font-size:clamp(1.65rem,4vw,2.6rem)}a{color:var(--accent)}.gallery{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}article{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.25rem;min-height:10rem}article h2{margin:.5rem 0;font-size:1.2rem}.avatar{width:3.25rem;height:3.25rem;border-radius:50%;display:grid;place-items:center;background:#eaf2ff;color:var(--accent);font-weight:800;font-size:1.35rem}.muted{color:var(--muted)}@media(max-width:36rem){header{display:block}}
  </style>
</head>
<body><main aria-labelledby="gallery-title">
  <header><div><small>Published program</small><h1 id="gallery-title">Meet the speakers</h1></div><a href="{% url 'plugins:speakerops:speakerops_embed' event.slug %}">View schedule</a></header>
  <div class="gallery">
  {% for speaker in speakers %}<article tabindex="0"><div class="avatar" aria-hidden="true">{{ speaker.name|first|upper }}</div><h2>{{ speaker.get_display_name }}</h2><p class="muted">Speaker at {{ event.name }}</p></article>
  {% empty %}<p>No published speakers yet.</p>{% endfor %}
  </div>
</main></body></html>
