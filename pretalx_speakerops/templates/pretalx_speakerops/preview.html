{% extends "orga/base.html" %}
{% load static %}

{% block stylesheets %}{{ block.super }}
<link rel="stylesheet" href="{% static 'pretalx_speakerops/carbon/carbon-styles.css' %}">
<style>
  .speakerops-page { max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .speakerops-page h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 .5rem; }
</style>
{% endblock stylesheets %}

{% block content %}
<main class="speakerops-page" aria-labelledby="preview-title">
  <h1 id="preview-title">Accelevents preview</h1>
  <p style="color:var(--cds-text-secondary,#525252); margin:0 0 1.5rem;">Preview synchronization plans from the sync console.</p>
  <a href="{% url 'plugins:speakerops:speakerops_sync_console' event.slug %}" class="cds--btn cds--btn--primary">Open sync console</a>
</main>
{% endblock content %}
