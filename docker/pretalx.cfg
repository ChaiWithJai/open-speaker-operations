[filesystem]
base = /usr/local/lib/python3.11/site-packages
data = /data
media = /data/media
static = /data/static
logs = /data/logs

[site]
debug = False
url = http://127.0.0.1:8001

[database]
backend = postgresql
name = speakerops
user = speakerops
password = speakerops
host = postgres
port = 5432

[mail]
from = admin@localhost
host = localhost
port = 25

[redis]
location = redis://redis:6379/0
session = True

[celery]
broker = redis://redis:6379/0
backend = redis://redis:6379/0
