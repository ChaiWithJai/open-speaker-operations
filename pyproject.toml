[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-speaker-operations"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "celery",
    "Faker",
    "freezegun",
    "gunicorn",
    "pretalx==2025.2.2",
    "psycopg[binary]",
    "redis",
]

[project.optional-dependencies]
dev = [
    "bleach",
    "celery",
    "drf-spectacular",
    "pytest",
    "pytest-django",
    "redis",
    "ruff",
]

[project.entry-points."pretalx.plugin"]
speakerops = "pretalx_speakerops"

[tool.setuptools.packages.find]
include = ["pretalx_speakerops*"]

[tool.setuptools.package-data]
pretalx_speakerops = [
    "data/**/*.json",
    "data/**/*.md",
    "static/**/*",
    "templates/**/*.html",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["pretalx_speakerops/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
