[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-speaker-operations"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pretalx==2025.2.2"]

[project.optional-dependencies]
dev = ["drf-spectacular", "ruff"]

[project.entry-points."pretalx.plugin"]
speakerops = "pretalx_speakerops"

[tool.setuptools.packages.find]
include = ["pretalx_speakerops*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["pretalx_speakerops/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
