name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Canonical contributor validation
        env:
          DJANGO_SETTINGS_MODULE: pretalx.common.settings.test_settings
          COMPOSE_PROJECT_NAME: speakerops-ci-${{ github.run_id }}
        run: make check

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: production-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chaiwithjai/open-speaker-operations:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable production image digest
        run: |
          test "$(printf '%s' '${{ steps.production-image.outputs.digest }}' | sed 's/^sha256:[0-9a-f]\{64\}$//')" = ""
          printf '%s\n' '${{ steps.production-image.outputs.digest }}' > production-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-image-digest
          path: production-image-digest.txt
          if-no-files-found: error
          retention-days: 30
