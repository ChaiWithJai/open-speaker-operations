name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  context-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce P0 proof coverage
        run: python scripts/check_context_graph.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ".[dev]" pytest pytest-django faker
      - name: Ruff lint
        run: ruff check pretalx_speakerops tests mock_accelevents
      - name: Ruff format
        run: ruff format --check pretalx_speakerops tests mock_accelevents
      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: pretalx.common.settings.test_settings
        run: pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: bash -n scripts/ci-compose-smoke.sh scripts/deploy-digitalocean.sh
      - name: Clean-volume deployment smoke test
        env:
          COMPOSE_PROJECT_NAME: speakerops-ci-${{ github.run_id }}
        run: scripts/ci-compose-smoke.sh

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [context-graph, python, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chaiwithjai/open-speaker-operations:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
