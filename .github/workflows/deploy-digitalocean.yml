name: Deploy DigitalOcean

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full 40-character commit SHA to deploy or roll back to
        required: true
        type: string
      image_digest:
        description: Immutable sha256 registry digest produced by the image job
        required: true
        type: string
      restore_demo_seed:
        description: Restore the deterministic speakerops-demo dataset after deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: speakerops-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.inputs.image_sha || github.event.workflow_run.head_sha }}
      APP_DIR: ${{ vars.DIGITALOCEAN_APP_DIR || '/opt/open-speaker-operations' }}
      PUBLIC_URL: ${{ vars.SPEAKEROPS_PUBLIC_URL || 'https://loop.dharmicdata.org' }}
    steps:
      - name: Validate immutable image SHA
        run: test "$(printf '%s' "$DEPLOY_SHA" | sed 's/[^0-9a-f]//g')" = "$DEPLOY_SHA" && test "${#DEPLOY_SHA}" -eq 40
      - name: Download image digest from successful CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: production-image-digest
          path: release-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve immutable image digest
        env:
          DISPATCH_DIGEST: ${{ github.event.inputs.image_digest }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            digest="$DISPATCH_DIGEST"
          else
            digest="$(tr -d '\r\n' < release-metadata/production-image-digest.txt)"
          fi
          test "$(printf '%s' "$digest" | sed 's/^sha256:[0-9a-f]\{64\}$//')" = ""
          printf 'IMAGE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
      - name: Check out release contract
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          path: release
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DIGITALOCEAN_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host *' \
            '  ServerAliveInterval 30' \
            '  ServerAliveCountMax 20' \
            '  TCPKeepAlive yes' \
            > ~/.ssh/config
          chmod 0600 ~/.ssh/config
      - name: Upload deployment contract
        env:
          HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          USER: ${{ secrets.DIGITALOCEAN_USER }}
        run: |
          scp release/docker-compose.yml release/deploy/smoke_journey.py release/deploy/scripts/{deploy-digitalocean.sh,backup-nightly.sh,verify-restore.sh,drill-image-rollback.sh} "$USER@$HOST:/tmp/"
          ssh "$USER@$HOST" "install -m 0644 /tmp/docker-compose.yml '$APP_DIR/docker-compose.yml' && install -m 0755 /tmp/deploy-digitalocean.sh '$APP_DIR/deploy-digitalocean.sh' && install -m 0755 /tmp/smoke_journey.py '$APP_DIR/smoke_journey.py' && install -m 0755 /tmp/backup-nightly.sh '$APP_DIR/backup-nightly.sh' && install -m 0755 /tmp/verify-restore.sh '$APP_DIR/verify-restore.sh' && install -m 0755 /tmp/drill-image-rollback.sh '$APP_DIR/drill-image-rollback.sh'"
      - name: Back up, deploy, and verify
        env:
          HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          USER: ${{ secrets.DIGITALOCEAN_USER }}
          IMAGE: ghcr.io/chaiwithjai/open-speaker-operations@${{ env.IMAGE_DIGEST }}
          RESTORE_DEMO_SEED: ${{ github.event.inputs.restore_demo_seed || 'false' }}
        run: ssh "$USER@$HOST" "SPEAKEROPS_APP_DIR='$APP_DIR' SPEAKEROPS_PUBLIC_URL='$PUBLIC_URL' SPEAKEROPS_EXPECTED_APP_VERSION='$DEPLOY_SHA' SPEAKEROPS_RESTORE_DEMO='$RESTORE_DEMO_SEED' '$APP_DIR/deploy-digitalocean.sh' '$IMAGE'"
